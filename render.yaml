# Render Blueprint: one web service runs FastAPI (hw4/backend) and serves the built React site.
# Secrets marked sync:false are entered in the Render dashboard (never committed).
# Product photos aren't in git; on Render they're served from Supabase (product_images table).
services:
  - type: web
    name: campus-customs
    runtime: python
    plan: free
    rootDir: hw4
    # Builds the React site if npm is available, otherwise uses the committed frontend/dist.
    buildCommand: (command -v npm >/dev/null 2>&1 && cd frontend && npm ci && npm run build || echo "using committed frontend/dist") && pip install -r requirements.txt
    # --proxy-headers: trust Render's X-Forwarded-For so lockouts see each shopper's real IP.
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NODE_VERSION
        value: 22.12.0
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: PORTKEY_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
